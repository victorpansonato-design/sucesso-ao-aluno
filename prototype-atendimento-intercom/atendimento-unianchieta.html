.cell-who__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}
.cell-who__ra {
  margin-top: 1px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-4);
}
.cell-course {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 260px;
}
.cell-sub {
  margin-top: 1px;
  font-size: 11px;
  color: var(--ink-4);
}
.cell-owner {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

/* -- Ficha 360 ------------------------------------------------------------ */
.hero360 {
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.hero360__id {
  display: flex;
  min-width: 0;
  flex: 1;
  gap: 14px;
}
.hero360__name {
  display: flex;
  align-items: baseline;
  gap: 9px;
  flex-wrap: wrap;
}
.hero360__name h1 {
  font-size: 22px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--ink);
}
.hero360__ra {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink-3);
}
.hero360__line {
  margin-top: 5px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--ink-3);
}

.timeline {
  position: relative;
  padding-left: 22px;
}
.timeline::before {
  content: "";
  position: absolute;
  top: 6px;
  bottom: 10px;
  left: 5px;
  width: 1px;
  background: var(--hairline);
}
.tl-item {
  position: relative;
  padding: 0 0 18px;
}
.tl-item:last-child {
  padding-bottom: 0;
}
.tl-item__dot {
  position: absolute;
  top: 4px;
  left: -21px;
  height: 11px;
  width: 11px;
  border-radius: var(--r-pill);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
}
.tl-item__dot i {
  height: 5px;
  width: 5px;
  border-radius: var(--r-pill);
  background: var(--ink-4);
}
.tl-item[data-tone="crit"] .tl-item__dot i {
  background: var(--crit);
}
.tl-item[data-tone="warn"] .tl-item__dot i {
  background: var(--warn);
}
.tl-item[data-tone="info"] .tl-item__dot i {
  background: var(--brand-2);
}
.tl-item__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.tl-item__title {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
}
.tl-item__when {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-4);
}
.tl-item__body {
  margin-top: 3px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-3);
}
.tl-item__meta {
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.ticket {
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 14px;
}
.ticket__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ticket__id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}
.ticket__subject {
  margin-top: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}
.ticket__grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  border-top: 1px solid var(--hairline);
  padding-top: 10px;
}
.ticket__k {
  font-size: 10.5px;
  color: var(--ink-4);
}
.ticket__v {
  margin-top: 2px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
}

/* Histórico somente leitura */
.readonly-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-2);
  padding: 8px 18px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
}

/* ==========================================================================
   8b. ACRÉSCIMOS DA VISÃO DO ATENDENTE
   --------------------------------------------------------------------------
   Foto de perfil, pastas, fixados, equipe sob demanda, ouvidoria, painel de
   notas ancorado, Copilot com resumo do caso, histórico cronológico, seletor
   de aparência e o desempenho do atendente. Mesmas cinco regras do topo.
   ========================================================================== */

/* -- Avatar com foto ------------------------------------------------------ */
.avatar {
  position: relative;
  overflow: hidden;
}
.avatar img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}
/* As iniciais ficam embaixo da foto — só aparecem se ela falhar. */
.avatar--photo {
  color: transparent;
  box-shadow: inset 0 0 0 1px rgb(16 19 23 / 0.06);
}
.dark .avatar--photo {
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06);
}

/* -- Coluna: pastas ------------------------------------------------------- */
.navgroup__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-right: 2px;
}
.navgroup__row .navgroup__head {
  width: auto;
  flex: 1;
}
.navgroup__row .iconbtn {
  opacity: 0.7;
}
.navgroup__row .iconbtn:hover {
  opacity: 1;
}
.navfolder {
  position: relative;
  border-radius: var(--r);
  transition: box-shadow 150ms, background-color 150ms;
}
.navfolder .navitem {
  padding-right: 30px;
}
.navfolder__more {
  position: absolute;
  top: 50%;
  right: 4px;
  z-index: 2;
  transform: translateY(-50%);
  opacity: 0;
  transition: opacity 150ms;
}
.navfolder:hover .navfolder__more,
.navfolder__more:focus-visible,
.navfolder__more[aria-expanded="true"] {
  opacity: 1;
}
/* No item ativo, o "…" está sobre a pílula azul. */
.navfolder:has(.navitem[aria-current="true"]) .navfolder__more {
  color: var(--on-brand);
}
.navfolder:has(.navitem[aria-current="true"]) .navfolder__more:hover {
  background: rgb(255 255 255 / 0.16);
}
.navfolder:hover .navitem__count {
  opacity: 0;
}
.navfolder .navitem__count {
  transition: opacity 150ms;
}
/* Enquanto arrasta, cada destino possível se anuncia; o que está sob o
   ponteiro ganha o contorno da marca. */
body.is-dragging-conv .navfolder {
  box-shadow: inset 0 0 0 1px var(--hairline-strong);
}
body.is-dragging-conv .navfolder[data-drop-over="true"] {
  background: var(--brand-soft);
  box-shadow: inset 0 0 0 2px var(--brand-2);
}
.navfolder-input {
  display: flex;
  align-items: center;
  gap: 9px;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 4px 8px;
  color: var(--ink-4);
}
.navfolder-input input {
  flex: 1;
  min-width: 0;
  height: 24px;
  border: 0;
  background: transparent;
  font-size: 13px;
  color: var(--ink);
}
.navfolder-input input:focus {
  outline: none;
}
.navfolder-input:focus-within {
  box-shadow: 0 0 0 2px var(--focus);
}
.navgroup__empty {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  font-size: 12px;
  color: var(--ink-4);
  border-radius: var(--r);
  transition: color 150ms, background-color 150ms;
}
.navgroup__empty:hover {
  background: var(--surface-2);
  color: var(--ink);
}

/* -- Equipe (rodapé da coluna) -------------------------------------------- */
.team-btn {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 9px;
  border-radius: var(--r);
  padding: 7px 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  transition: background-color 150ms, color 150ms;
}
.team-btn:hover,
.team-btn[aria-expanded="true"] {
  background: var(--surface-2);
  color: var(--ink);
}
.team-btn > svg:first-child {
  color: var(--ink-4);
}
.team-btn__label {
  flex: 1;
  text-align: left;
}
.team-btn__live {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}
.team-btn__live i {
  height: 6px;
  width: 6px;
  border-radius: var(--r-pill);
  background: var(--brand-2);
}
.team-btn > svg:last-child {
  color: var(--ink-4);
  transition: transform 220ms var(--emphasis);
}
.team-btn[aria-expanded="true"] > svg:last-child {
  transform: rotate(180deg);
}

/* Presença: o mesmo vocabulário em todo lugar. Disponível é o azul da casa
   (é o estado bom, e é o único que convida a agir); em atendimento é tinta;
   ausente é âmbar; offline é um anel vazio. */
.presence-dot {
  display: inline-block;
  height: 8px;
  width: 8px;
  flex-shrink: 0;
  border-radius: var(--r-pill);
  background: var(--ink-4);
}
.presence-dot[data-state="online"] {
  background: var(--brand-2);
}
.presence-dot[data-state="ocupado"] {
  background: var(--ink-3);
}
.presence-dot[data-state="ausente"] {
  background: var(--warn);
}
.presence-dot[data-state="offline"] {
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--ink-4);
}
.presence[data-state="online"] {
  background: var(--brand-2);
}
.presence[data-state="ocupado"] {
  background: var(--ink-3);
}

.team-pop__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.team-pop__sum {
  display: flex;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
}
.team-pop__sum span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.team-pop__sum .presence-dot {
  height: 6px;
  width: 6px;
}
.team-pop__list {
  max-height: 340px;
}
.team-row {
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--r-sm);
  padding: 7px 8px;
}
.team-row + .team-row {
  border-top: 1px solid var(--hairline);
  border-radius: 0;
}
.team-row__av {
  position: relative;
}
.team-row__av .presence-dot {
  position: absolute;
  right: -1px;
  bottom: -1px;
  box-shadow: 0 0 0 2px var(--surface-raised);
}
.team-row__av .presence-dot[data-state="offline"] {
  background: var(--surface-raised);
  box-shadow: 0 0 0 2px var(--surface-raised), inset 0 0 0 1.5px var(--ink-4);
}
.team-row__text {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
}
.team-row__name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
}
.team-row__you {
  font-weight: 400;
  color: var(--ink-4);
}
.team-row__role {
  font-size: 11px;
  color: var(--ink-4);
}
.team-row__state {
  flex-shrink: 0;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
}
.team-row__state[data-state="online"] {
  color: var(--brand-text);
}
.team-row__state[data-state="ausente"] {
  color: var(--warn-ink);
}
.team-row__state[data-state="offline"] {
  color: var(--ink-4);
  font-weight: 400;
}
.team-pop__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--ink-4);
  padding: 8px 12px;
}

/* -- Lista: fixadas, pasta, arrasto --------------------------------------- */
.panehead__title h2 {
  display: flex;
  align-items: center;
  gap: 6px;
}
.panehead__folder {
  color: var(--ink-4);
}
.conv-group {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 12px 16px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-4);
}
.conv-group + .conv::before {
  display: none;
}
.conv__pin {
  display: flex;
  height: 22px;
  width: 22px;
  margin: -4px -6px -4px 0;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-sm);
  color: var(--ink-4);
  opacity: 0;
  transition: opacity 150ms, background-color 150ms, color 150ms;
}
.conv:hover .conv__pin,
.conv:focus-visible .conv__pin {
  opacity: 1;
}
.conv__pin:hover {
  background: var(--surface-3);
  color: var(--ink);
}
.conv:hover .conv__time {
  display: none;
}
.conv__pinned {
  display: inline-flex;
  vertical-align: -1px;
  margin-right: 5px;
  color: var(--brand-2);
}
.conv__pinned svg {
  display: inline-block;
}
.tag--ouv {
  background: var(--brand-soft);
  color: var(--brand-text);
}
.tag--folder svg,
.tag--ouv svg {
  opacity: 0.8;
}
.conv.is-dragging {
  opacity: 0.45;
}
.conv[draggable="true"] {
  -webkit-user-drag: element;
}

/* -- Cabeçalho da conversa e faixa da ouvidoria --------------------------- */
.thread-head__pin {
  color: var(--brand-2);
  align-self: center;
}
.thread-strip {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ouv-strip {
  position: relative;
  display: flex;
  width: 100%;
  align-items: center;
  gap: 10px;
  overflow: hidden;
  border-radius: var(--r);
  background: var(--brand-soft);
  padding: 9px 12px 9px 14px;
  text-align: left;
  transition: background-color 150ms;
}
.ouv-strip::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 2px;
  background: var(--brand);
}
.ouv-strip:hover {
  background: var(--brand-soft-2);
}
.ouv-strip__icon {
  color: var(--brand-text);
}
.ouv-strip__body {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  gap: 1px;
}
.ouv-strip__title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}
.ouv-strip__title .mono {
  font-size: 12px;
  font-weight: 500;
}
.ouv-strip__meta {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11.5px;
  color: var(--ink-3);
}
.ouv-strip__deadline {
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--brand-text);
}
.ouv-strip[data-tone="warn"] .ouv-strip__deadline {
  color: var(--warn-ink);
}
.ouv-strip[data-tone="crit"] .ouv-strip__deadline {
  color: var(--crit-ink);
}
.ouv-strip__go {
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
  transition: color 150ms;
}
.ouv-strip:hover .ouv-strip__go {
  color: var(--ink);
}

/* -- Painel direito -------------------------------------------------------- */
.seg--fill {
  display: flex;
  width: 100%;
}
.seg--fill .seg__opt {
  flex: 1;
  padding: 0 8px;
}
.ctx--enter {
  animation: atd-fade 220ms var(--emphasis);
}

/* O resumo do Copilot já na aba Aluno: a primeira coisa a ler. */
.cp-teaser {
  display: flex;
  margin: 0 16px 14px;
  width: calc(100% - 32px);
  flex-direction: column;
  gap: 4px;
  border-radius: var(--r);
  background: var(--brand-soft);
  padding: 11px 12px 10px;
  text-align: left;
  transition: background-color 150ms;
}
.cp-teaser:hover {
  background: var(--brand-soft-2);
}
.cp-teaser__head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--brand-text);
}
.cp-teaser__sent {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 500;
  color: var(--ink-3);
}
.cp-teaser__sent i,
.cp-sent i {
  height: 6px;
  width: 6px;
  border-radius: var(--r-pill);
  background: var(--ink-4);
}
[data-tone="info"] > i {
  background: var(--brand-2);
}
[data-tone="warn"] > i {
  background: var(--warn);
}
[data-tone="risk"] > i {
  background: var(--risk);
}
[data-tone="crit"] > i {
  background: var(--crit);
}
.cp-teaser__need {
  font-size: 12.5px;
  line-height: 1.55;
  font-weight: 500;
  color: var(--ink);
}
.cp-teaser__go {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-3);
}
.cp-teaser:hover .cp-teaser__go {
  color: var(--brand-text);
}

/* Mini régua da ouvidoria (aba Aluno) */
.ouv-mini {
  display: flex;
  margin: 0 16px 14px;
  width: calc(100% - 32px);
  flex-direction: column;
  gap: 10px;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 11px 12px 12px;
  text-align: left;
  transition: background-color 150ms;
}
.ouv-mini:hover {
  background: var(--surface-3);
}
.ouv-mini__top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 4px 8px;
}
.ouv-mini__title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}
.ouv-mini__title svg {
  color: var(--brand-text);
}
.ouv-mini__title .mono {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
  white-space: nowrap;
}
.ouv-mini__dl,
.ouv-card__dl {
  font-size: 11px;
  font-weight: 600;
  color: var(--brand-text);
}
.ouv-mini__dl {
  white-space: nowrap;
}
.ouv-mini__dl[data-tone="warn"],
.ouv-card__dl[data-tone="warn"] {
  color: var(--warn-ink);
}
.ouv-mini__dl[data-tone="crit"],
.ouv-card__dl[data-tone="crit"] {
  color: var(--crit-ink);
}

/* Régua de etapas: feito (marca), agora (anel), próximo (vazio). */
.ouv-steps {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
}
.ouv-steps__item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-width: 0;
}
.ouv-steps__item::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 14px;
  right: -4px;
  height: 2px;
  border-radius: 2px;
  background: var(--hairline-strong);
}
.ouv-steps__item:last-child::before {
  display: none;
}
.ouv-steps__item[data-state="done"]::before {
  background: var(--brand-2);
}
.ouv-steps__dot {
  position: relative;
  z-index: 1;
  display: flex;
  height: 14px;
  width: 14px;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-pill);
  background: var(--surface-3);
  box-shadow: inset 0 0 0 1.5px var(--hairline-strong);
  color: var(--on-brand);
}
.ouv-steps__item[data-state="done"] .ouv-steps__dot {
  background: var(--brand);
  box-shadow: none;
}
.ouv-steps__item[data-state="now"] .ouv-steps__dot {
  background: var(--surface);
  box-shadow: inset 0 0 0 3.5px var(--brand-2);
}
.ouv-steps__label {
  font-size: 10.5px;
  line-height: 1.3;
  color: var(--ink-4);
}
.ouv-steps__item[data-state="now"] .ouv-steps__label {
  font-weight: 600;
  color: var(--ink);
}
.ouv-steps__item[data-state="done"] .ouv-steps__label {
  color: var(--ink-3);
}
.ouv-steps--compact .ouv-steps__label {
  font-size: 10px;
}

.kv-folder {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.kv-folder svg {
  color: var(--ink-4);
}

/* -- Notas internas: rodapé ancorado com rolagem própria ----------------- */
.notes-dock {
  display: flex;
  flex-shrink: 0;
  flex-direction: column;
  max-height: min(38%, 300px);
  border-top: 1px solid var(--hairline);
  background: var(--surface);
}
.notes-dock__head {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px 6px 16px;
}
.notes-dock__title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.notes-dock__title svg {
  color: var(--warn);
}
.notes-dock__count {
  min-width: 18px;
  border-radius: var(--r-pill);
  background: var(--warn-soft);
  padding: 1px 6px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--warn-ink);
}
.notes-dock__hint {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  color: var(--ink-4);
}
.notes-dock__list {
  display: flex;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  gap: 6px;
  padding: 2px 12px 8px;
}
.note-card {
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: var(--warn-soft);
  padding: 8px 10px 8px 12px;
}
.note-card::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 2px;
  background: var(--warn);
}
.note-card--new {
  animation: atd-msg-in 320ms var(--emphasis);
}
.note-card__meta {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 2px;
  font-size: 10.5px;
  color: var(--ink-4);
}
.note-card__who {
  font-size: 11px;
  font-weight: 600;
  color: var(--warn-ink);
}
.note-card__when {
  font-family: var(--font-mono);
}
.note-card__scope {
  margin-left: auto;
  white-space: nowrap;
}
.note-card__text {
  font-size: 12px;
  line-height: 1.55;
  color: var(--ink);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.notes-dock__empty {
  padding: 4px 4px 6px;
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--ink-4);
}
.notes-dock__form {
  display: flex;
  flex-shrink: 0;
  align-items: flex-end;
  gap: 4px;
  margin: 0 12px 12px;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 4px 4px 4px 10px;
  transition: box-shadow 150ms, background-color 150ms;
}
.notes-dock__form:focus-within {
  background: var(--warn-soft);
  box-shadow: 0 0 0 2px var(--warn);
}
.notes-dock__form textarea {
  display: block;
  min-height: 26px;
  flex: 1;
  resize: none;
  border: 0;
  background: transparent;
  padding: 4px 0;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink);
}
.notes-dock__form textarea:focus {
  outline: none;
}
.notes-dock__send:hover {
  color: var(--warn-ink);
}

/* -- Histórico ------------------------------------------------------------ */
.hist {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 14px 16px 18px;
}
.ouv-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 14px;
}
.ouv-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.ouv-card__title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.ouv-card__title svg {
  color: var(--brand-text);
}
.ouv-card__type {
  border-radius: var(--r-sm);
  background: var(--surface);
  padding: 2px 7px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-2);
}
.ouv-card__protocol {
  margin-top: -6px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.ouv-card__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 14px;
  border-top: 1px solid var(--hairline);
  padding-top: 12px;
  margin: 0;
}
.ouv-card__grid dt {
  font-size: 10.5px;
  color: var(--ink-4);
}
.ouv-card__grid dd {
  margin: 2px 0 0;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 500;
  color: var(--ink);
}
.hist__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.hist__label {
  white-space: nowrap;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-3);
}
.hist__list {
  position: relative;
}
.hist-day {
  position: sticky;
  top: -1px;
  z-index: 1;
  margin: 4px 0 6px;
  background: var(--surface);
  padding: 4px 0;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-4);
}
.hist-item {
  position: relative;
  display: flex;
  gap: 10px;
  padding: 0 0 14px;
}
.hist-item::before {
  content: "";
  position: absolute;
  top: 22px;
  bottom: 2px;
  left: 10px;
  width: 1px;
  background: var(--hairline);
}
.hist-item__dot {
  position: relative;
  z-index: 1;
  display: flex;
  height: 21px;
  width: 21px;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  color: var(--ink-3);
}
.hist-item[data-kind="ouvidoria"] .hist-item__dot {
  background: var(--brand);
  color: var(--on-brand);
}
.hist-item[data-kind="setor"] .hist-item__dot {
  background: var(--brand-soft);
  color: var(--brand-text);
}
.hist-item[data-kind="prazo"] .hist-item__dot {
  background: var(--crit-soft);
  color: var(--crit-ink);
}
.hist-item[data-kind="nota"] .hist-item__dot {
  background: var(--warn-soft);
  color: var(--warn-ink);
}
.hist-item[data-kind="aluno"] .hist-item__dot,
.hist-item[data-kind="atual"] .hist-item__dot {
  background: var(--surface-3);
  color: var(--ink);
}
.hist-item__main {
  min-width: 0;
  flex: 1;
}
.hist-item__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.hist-item__title {
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--ink);
}
.hist-item__when {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-4);
}
.hist-item__body {
  margin-top: 2px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--ink-3);
}
.hist-item__meta {
  margin-top: 5px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  font-size: 11px;
  color: var(--ink-4);
}
.hist-item__kind {
  font-weight: 600;
  color: var(--ink-3);
}
.hist-item[data-kind="ouvidoria"] .hist-item__kind,
.hist-item[data-kind="setor"] .hist-item__kind {
  color: var(--brand-text);
}
.hist-item[data-kind="prazo"] .hist-item__kind {
  color: var(--crit-ink);
}
.hist-item[data-kind="nota"] .hist-item__kind {
  color: var(--warn-ink);
}
.hist-item__meta .linkbtn {
  margin-left: auto;
  font-size: 11px;
}

/* -- Copilot -------------------------------------------------------------- */
.copilot {
  gap: 14px;
}
.cp-brief {
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 14px;
  animation: atd-msg-in 260ms var(--emphasis);
}
.cp-brief__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.cp-brief__title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.cp-brief__title svg {
  color: var(--brand-2);
}
.cp-brief__stamp {
  font-size: 10.5px;
  color: var(--ink-4);
}
.cp-brief__k {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.cp-brief__need {
  margin-top: -6px;
  font-size: 14px;
  line-height: 1.5;
  font-weight: 500;
  letter-spacing: -0.012em;
  color: var(--ink);
}
.cp-brief__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.cp-sent,
.cp-intent {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: var(--r-sm);
  background: var(--surface);
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-2);
}
.cp-intent svg {
  color: var(--ink-4);
}
.cp-brief__sec {
  display: flex;
  flex-direction: column;
  gap: 5px;
  border-top: 1px solid var(--hairline);
  padding-top: 10px;
}
.cp-brief__text {
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.cp-chrono {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0;
  margin: 0;
  list-style: none;
}
.cp-chrono li {
  display: flex;
  gap: 8px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-2);
}
.cp-chrono .mono {
  flex-shrink: 0;
  width: 38px;
  font-size: 11px;
  color: var(--ink-4);
  padding-top: 1px;
}
.cp-todo {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.cp-todo__item {
  display: flex;
  width: 100%;
  align-items: flex-start;
  gap: 8px;
  border-radius: var(--r-sm);
  margin: 0 -6px;
  padding: 4px 6px;
  text-align: left;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink);
  transition: background-color 150ms, color 150ms;
}
.cp-todo__item:hover {
  background: var(--surface-3);
}
.cp-todo__item svg {
  margin-top: 1px;
  color: var(--ink-4);
}
.cp-todo__item[aria-pressed="true"] {
  color: var(--ink-4);
  text-decoration: line-through;
  text-decoration-color: var(--hairline-strong);
}
.cp-todo__item[aria-pressed="true"] svg {
  color: var(--brand-2);
}
.cp-watch {
  display: flex;
  gap: 8px;
  border-radius: var(--r-sm);
  background: var(--warn-soft);
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--warn-ink);
}
.cp-watch svg {
  margin-top: 2px;
}
.cp-brief__foot {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding-top: 2px;
}
.cp-ask {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cp-ask__field {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-2);
  padding: 3px 3px 3px 12px;
  color: var(--brand-2);
  transition: box-shadow 150ms;
}
.cp-ask__field:focus-within {
  box-shadow: 0 0 0 2px var(--focus);
}
.cp-ask__field input {
  height: 28px;
  min-width: 0;
  flex: 1;
  border: 0;
  background: transparent;
  font-size: 12.5px;
  color: var(--ink);
}
.cp-ask__field input:focus {
  outline: none;
}
.cp-ask__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.chip--sm {
  height: 24px;
  padding: 0 10px;
  font-size: 11.5px;
}
.cp-ask__answer {
  border-radius: var(--r);
  background: var(--brand-soft);
  padding: 10px 12px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink);
  animation: atd-msg-in 240ms var(--emphasis);
}
.cp-sec {
  border-top: 1px solid var(--hairline);
  padding-top: 12px;
}
.cp-sec__title {
  margin-bottom: 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
}

/* -- Transferência -------------------------------------------------------- */
.qpick {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}
.qpick__opt {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 9px;
  align-items: center;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 9px 10px;
  text-align: left;
  transition: background-color 150ms, box-shadow 150ms;
}
.qpick__opt:hover {
  background: var(--surface-3);
}
.qpick__opt[aria-checked="true"] {
  background: var(--brand-soft);
  box-shadow: inset 0 0 0 2px var(--brand-2);
}
.qpick__icon {
  grid-row: span 2;
  display: flex;
  height: 28px;
  width: 28px;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink-3);
}
.qpick__opt[aria-checked="true"] .qpick__icon {
  color: var(--brand-text);
}
.qpick__name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}
.qpick__wait {
  font-size: 11px;
  color: var(--ink-4);
}
.checkrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
}
.checkrow input {
  height: 15px;
  width: 15px;
  accent-color: var(--brand);
}

/* -- Seletor de aparência ------------------------------------------------- */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  padding: 2px 10px 10px;
}
.theme-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-radius: var(--r);
  padding: 6px 6px 8px;
  text-align: left;
  transition: background-color 150ms, box-shadow 150ms, transform 90ms var(--emphasis);
}
.theme-card:hover {
  background: var(--surface-2);
}
.theme-card:active {
  transform: scale(0.98);
}
.theme-card[aria-pressed="true"] {
  background: var(--surface-2);
  box-shadow: inset 0 0 0 2px var(--brand-2);
}
.theme-card__preview {
  position: relative;
  display: flex;
  height: 74px;
  gap: 5px;
  overflow: hidden;
  border-radius: var(--r-sm);
  padding: 6px;
  box-shadow: inset 0 0 0 1px rgb(127 127 127 / 0.22);
}
.theme-card__rail {
  display: flex;
  width: 9px;
  flex-direction: column;
  align-items: center;
  padding-top: 2px;
}
.theme-card__rail i {
  height: 7px;
  width: 7px;
  border-radius: 2px;
}
.theme-card__slab {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 5px;
  border-radius: 5px;
  padding: 7px;
}
.theme-card__line {
  height: 4px;
  border-radius: 2px;
  opacity: 0.85;
}
.theme-card__row {
  height: 9px;
  border-radius: 3px;
}
.theme-card__btn {
  margin-top: auto;
  height: 8px;
  width: 34%;
  border-radius: 9999px;
}
.theme-card__text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 0 2px;
}
.theme-card__name {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
}
.theme-card__name svg {
  color: var(--brand-2);
}
.theme-card__desc {
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink-4);
}

/* -- Desempenho ----------------------------------------------------------- */
.section-label__hint {
  font-size: 11px;
  color: var(--ink-4);
}
.perf-now {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 22px;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 11px 16px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.perf-now__item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.perf-now b {
  font-weight: 600;
  color: var(--ink);
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.kpi {
  display: flex;
  flex-direction: column;
  border-radius: var(--r);
  background: var(--surface-2);
  padding: 16px;
}
.kpi__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.kpi__label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
}
.kpi__value {
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 28px;
  line-height: 1;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.kpi__hint {
  margin-top: 6px;
  font-size: 11px;
  color: var(--ink-4);
}
.kpi__cmp {
  margin-top: 14px;
  border-top: 1px solid var(--hairline);
  padding-top: 10px;
}
.kpi__bars {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.kpi__bar {
  display: block;
  height: 5px;
  min-width: 4px;
  border-radius: var(--r-pill);
  transition: width 620ms var(--emphasis);
}
.kpi__bar--me,
.kpi__sw--me {
  background: var(--brand);
}
.kpi__bar--team,
.kpi__sw--team {
  background: var(--ink-4);
  opacity: 0.55;
}
.kpi__legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 10px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--ink-4);
}
.kpi__legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.kpi__legend b {
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--ink-2);
}
.kpi__sw {
  height: 7px;
  width: 7px;
  border-radius: 2px;
}
.trend svg {
  display: inline-block;
}
/* Tendência só ganha cor quando tem lado certo: tempo caindo é bom, nota
   caindo é ruim. Volume não tem lado — fica em tinta. */
.trend[data-good="true"] {
  color: var(--brand-text);
}
.trend[data-good="false"] {
  color: var(--warn-ink);
}
.trend[data-dir="down"]:not([data-good]) {
  color: var(--ink-3);
}
.nowrow--team {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}
.nowrow--team .metric__value {
  font-size: 24px;
}
.dash-sla {
  margin-top: 16px;
  border-top: 1px solid var(--hairline);
  padding-top: 14px;
}
.dash-sla__row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.range-pop {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 2px 12px 12px;
}
.range-pop .label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin: 0;
}
.range-pop .input {
  padding: 0 8px;
  font-size: 12.5px;
}
.range-pop__quick {
  grid-column: 1 / -1;
  display: flex;
  gap: 5px;
}
.range-pop .help {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--crit-ink);
}

@media (max-width: 1320px) {
  .kpi-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .nowrow--team {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (max-width: 1080px) {
  .nowrow--team {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* ==========================================================================
   9. RESPONSIVO — prioridade desktop (1366 → 1920)
   ========================================================================== */

@media (min-width: 1700px) {
  :root {
    --views-w: 248px;
    --list-w: 384px;
    --context-w: 352px;
  }
}

@media (max-width: 1500px) {
  :root {
    --views-w: 220px;
    --list-w: 336px;
    --context-w: 312px;
  }
  .page__inner {
    padding: 20px 22px 36px;
  }
}

@media (max-width: 1320px) {
  :root {
    --list-w: 312px;
    --context-w: 296px;
  }
  .nowrow {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
  }
  .grid--dash,
  .grid--360 {
    grid-template-columns: minmax(0, 1fr);
  }
  .grid--4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 1180px) {
  .col-views {
    display: none;
  }
  .app[data-views-overlay="true"] .col-views {
    position: fixed;
    top: 10px;
    bottom: 10px;
    left: var(--rail-w);
    z-index: 40;
    display: flex;
    width: 260px;
    border-radius: var(--r);
    background: var(--surface);
    box-shadow: var(--shadow-overlay);
    padding: 12px;
    animation: atd-views-in 240ms var(--emphasis);
  }
  @keyframes atd-views-in {
    from {
      opacity: 0;
      transform: translateX(-12px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  .slab {
    margin-left: 0;
  }
}

@media (max-width: 1400px) {
  .pane--context {
    display: none;
  }
  .app[data-context="on"] .pane--context {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    display: flex;
    width: 320px;
    background: var(--surface);
    box-shadow: var(--shadow-overlay);
    animation: atd-ctx-in 240ms var(--emphasis);
  }
  @keyframes atd-ctx-in {
    from {
      opacity: 0;
      transform: translateX(16px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
}

@media (max-width: 1080px) {
  .grid--2,
  .grid--3,
  .grid--4 {
    grid-template-columns: minmax(0, 1fr);
  }
  .nowrow {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .ticket__grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 880px) {
  .pane--list {
    width: 100%;
  }
  .app[data-mobile-pane="thread"] .pane--list {
    display: none;
  }
  .app:not([data-mobile-pane="thread"]) .pane--thread {
    display: none;
  }
  .teamrow {
    grid-template-columns: minmax(0, 1fr) 70px 70px;
  }
  .teamrow__hide {
    display: none;
  }
}

/* ==========================================================================
   app.js — Central de Atendimento UniAnchieta (protótipo estático)

   Arquitetura de produto inspirada na Intercom Inbox; identidade visual e
   motion vindos do DESIGN_SYSTEM.md do projeto. Sem build, sem backend: todo
   o comportamento é estado local em JavaScript.

   Organização deste arquivo:
     1. utilidades          6. inbox — painel contextual e copilot
     2. estado e derivações 7. dashboard
     3. overlays            8. contatos e ficha 360

(function () {
  'use strict';

  var D = window.DATA;
  var I = window.ICON;

     1. UTILIDADES
     ====================================================================== */

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }
  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function cls() {
    return Array.prototype.filter
      .call(arguments, function (c) {
        return !!c;
      })
      .join(' ');
  }
  function pad(n) {
    return (n < 10 ? '0' : '') + n;
  }

  /** Relógio da operação: "agora", "12 min", "3 h", "ontem", "12/09". */
  function relTime(ts) {
    var diff = Math.round((Date.now() - ts) / 60000);
    if (diff < 1) return 'agora';
    if (diff < 60) return diff + ' min';
    var h = Math.floor(diff / 60);
    if (h < 24) return h + ' h';
    var d = Math.floor(h / 24);
    if (d === 1) return 'ontem';
    if (d < 7) return d + ' d';
    var dt = new Date(ts);
    return pad(dt.getDate()) + '/' + pad(dt.getMonth() + 1);
  }
  function clock(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function dayLabel(ts) {
    var d = new Date(ts);
    var today = new Date();
    var y = new Date(today.getTime() - 86400000);
    if (d.toDateString() === today.toDateString()) return 'Hoje';
    if (d.toDateString() === y.toDateString()) return 'Ontem';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
  }
  function fullDate(ts) {
    var d = new Date(ts);

      pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' · ' + clock(ts)
    );
  }
  /** Versão curta, para a linha de meta da fila: "24m", "3h10", "2d". */
  function durShort(min) {
    if (min < 60) return Math.round(min) + 'm';
    var h = Math.floor(min / 60);
    if (h < 24) return h + 'h' + pad(Math.round(min % 60));
    return Math.floor(h / 24) + 'd';
  }

  /** Duração em minutos → "4 min", "2h 51", "1d 3h". */
  function dur(min) {
    if (min < 60) return Math.round(min) + ' min';
    var h = Math.floor(min / 60);
    if (h < 24) return h + 'h ' + pad(Math.round(min % 60));
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';

  function money(v) {
    return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');

    return '***.' + cpf.slice(4, 7) + '.' + cpf.slice(8, 11) + '-**';

  function student(id) {

  function updatedAt(c) {
    return lastMsg(c).at;

  /**

   * calculada uma vez e usada em todo lugar: lista, cabeçalho e dashboard.
   */
  function sla(c) {
    if (c.status === 'encerrado') return { state: 'fechado', label: 'Encerrado', mins: 0 };
    if (c.status === 'snoozed')

    var mins = Math.round((c.slaDue - Date.now()) / 60000);
    if (mins < 0) return { state: 'estourado', label: 'SLA estourado há ' + dur(-mins), mins: mins };
    if (mins <= 15) return { state: 'proximo', label: 'SLA em ' + dur(mins), mins: mins };

  /* Visão do atendente: só o que ele usa no turno. Filas da equipe, menções,

  var VIEWS = [
    { id: 'minha', name: 'Minha caixa', icon: 'inbox', hint: 'As conversas que são suas' },

  function inView(c, view) {
    if (view.indexOf('pasta:') === 0) return c.folder === view.slice(6) && c.assignee === D.ME.id;

      case 'minha':

      case 'encerrados':

    S.folders = [

    var ph = pop.offsetHeight;

  /* -- Modal --------------------------------------------------------------- */
  var FOCUSABLE =
    'a[href],button:not([disabled]),textarea:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])';

  function openSheet(kind, opts) {
    var prev = document.activeElement;
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    var wrap = document.createElement('div');

    if (kind === 'modal') {
      wrap.className = 'modal-wrap';
      wrap.innerHTML =
        '<div class="modal modal--' +
        (opts.size || 'md') +
        '" role="dialog" aria-modal="true" tabindex="-1">' +
        (opts.title
          ? '<header class="modal__head"><div class="modal__head-id">' +
            (opts.icon ? '<div class="modal__icon">' + I(opts.icon, 18) + '</div>' : '') +
            '<div><h2 class="modal__title">' +
            esc(opts.title) +
            '</h2>' +
            (opts.sub ? '<p class="modal__sub">' + esc(opts.sub) + '</p>' : '') +
            '</div></div>' +
            '<button class="modal__close" data-close aria-label="Fechar">' +
            I('x', 16) +
            '</button></header>'
          : '') +
        '<div class="modal__body scroll-slim">' +
        opts.body +
        '</div>' +
        (opts.footer ? '<footer class="modal__foot' + (opts.footerSplit ? ' modal__foot--split' : '') + '">' + opts.footer + '</footer>' : '') +
        '</div>';
    } else {
      wrap.className = 'drawer-wrap';
      wrap.innerHTML =
        '<aside class="drawer" role="dialog" aria-modal="true" aria-label="' +
        esc(opts.label || 'Painel') +
        '" tabindex="-1">' +
        opts.body +
        '</aside>';
    }

    overlayRoot.appendChild(scrim);
    overlayRoot.appendChild(wrap);
    var sheet = $('.modal, .drawer', wrap);

    function close() {
      var idx = modalStack.indexOf(entry);
      if (idx >= 0) modalStack.splice(idx, 1);
      sheet.setAttribute('data-closing', 'true');
      scrim.setAttribute('data-closing', 'true');
      setTimeout(function () {
        wrap.remove();
        scrim.remove();
        if (prev && prev.focus) prev.focus();
      }, 200);
    }
    var entry = { close: close, el: sheet };
    modalStack.push(entry);

    scrim.addEventListener('mousedown', close);
    wrap.addEventListener('mousedown', function (e) {
      if (e.target === wrap) close();
    });
    wrap.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) close();
    });
    /* Trap de foco: a folha não devolve o Tab para o app atrás dela. */
    wrap.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      var f = $$(FOCUSABLE, sheet).filter(function (el) {
        return el.offsetParent !== null;
      });
      if (!f.length) return;
      var first = f[0];
      var last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    setTimeout(function () {
      var target = $('[data-autofocus]', sheet) || $(FOCUSABLE, sheet) || sheet;
      target.focus();
    }, 60);

    if (opts.onMount) opts.onMount(sheet, close);
    return { el: sheet, close: close };
  }

  function openModal(opts) {
    return openSheet('modal', opts);
  }
  function openDrawer(opts) {
    return openSheet('drawer', opts);
  }

  /* -- Toast --------------------------------------------------------------- */
  function toast(text, opts) {
    opts = opts || {};
    var host = $('#toasts');
    var el = document.createElement('div');
    el.className = 'toast';
    if (opts.tone) el.setAttribute('data-tone', opts.tone);
    el.innerHTML =
      '<span class="toast__icon">' +
      I(opts.icon || 'check', 15) +
      '</span><div class="toast__text">' +
      esc(text) +
      (opts.sub ? '<div class="toast__sub">' + esc(opts.sub) + '</div>' : '') +
      '</div>' +
      (opts.action ? '<button class="toast__action" data-toast-action>' + esc(opts.action) + '</button>' : '');
    host.appendChild(el);
    var timer = setTimeout(remove, opts.timeout || 4200);
    function remove() {
      clearTimeout(timer);
      el.setAttribute('data-closing', 'true');
      setTimeout(function () {
        el.remove();
      }, 150);
    }
    if (opts.action) {
      $('[data-toast-action]', el).addEventListener('click', function () {
        remove();
        if (opts.onAction) opts.onAction();
      });
    }
    return remove;
  }

  /* -- Tooltip ------------------------------------------------------------- */
  var tipEl = null;
  var tipTimer = null;
  function showTip(target) {
    hideTip();
    tipTimer = setTimeout(function () {
      var text = target.getAttribute('data-tip');
      if (!text) return;
      var k = target.getAttribute('data-tip-key');
      tipEl = document.createElement('div');
      tipEl.className = 'tooltip';
      tipEl.innerHTML = esc(text) + (k ? '<kbd>' + esc(k) + '</kbd>' : '');
      $('#tooltip-root').appendChild(tipEl);
      var r = target.getBoundingClientRect();
      var tw = tipEl.offsetWidth;
      var pos = target.getAttribute('data-tip-pos') || 'bottom';
      var left = r.left + r.width / 2 - tw / 2;
      var top = pos === 'right' ? r.top + r.height / 2 - tipEl.offsetHeight / 2 : r.bottom + 7;
      if (pos === 'right') left = r.right + 8;
      if (pos === 'top') top = r.top - tipEl.offsetHeight - 7;
      tipEl.style.left = Math.max(8, Math.min(left, window.innerWidth - tw - 8)) + 'px';
      tipEl.style.top = Math.max(8, top) + 'px';
    }, 380);
  }
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipEl) {
      tipEl.remove();
      tipEl = null;
    }
  }

  /** Dias úteis entre agora e `ts` — a régua da Ouvidoria é em dias úteis. */
  function businessDays(ts) {
    var d = new Date();
    var end = new Date(ts);
    var n = 0;
    var sign = end >= d ? 1 : -1;
    var cur = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var last = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    while ((sign > 0 && cur < last) || (sign < 0 && cur > last)) {
      cur.setDate(cur.getDate() + sign);
      var w = cur.getDay();
      if (w !== 0 && w !== 6) n += sign;
    }
    return n;
  }

  function ouvDeadline(o) {
    var n = businessDays(o.deadline);
    if (n < 0) return { tone: 'crit', label: 'prazo vencido há ' + -n + (n === -1 ? ' dia útil' : ' dias úteis') };
    if (n === 0) return { tone: 'crit', label: 'prazo vence hoje' };
    if (n <= 3) return { tone: 'warn', label: 'prazo em ' + n + (n === 1 ? ' dia útil' : ' dias úteis') };
    return { tone: 'info', label: 'prazo em ' + n + ' dias úteis' };
  }

  /* A faixa da Ouvidoria: protocolo, tipo, etapa e prazo — as quatro coisas
     que o aluno vai perguntar. Clicar abre o histórico completo ao lado. */
  function ouvStripHtml(c) {
    var o = c.ouvidoria;
    var dl = ouvDeadline(o);
    return (
      '<button class="ouv-strip" data-tone="' +
      dl.tone +

      '<span class="ouv-strip__icon">' +
      I('megaphone', 14) +

      '<span class="ouv-strip__body"><span class="ouv-strip__title">Ouvidoria · <span class="mono">' +
      esc(o.protocol) +
      '</span> · ' +
      esc(o.type) +
      '</span><span class="ouv-strip__meta">' +
      esc(D.OUV_STAGES[o.stage - 1]) +
      ' · ' +
      esc(o.sector) +
      '</span></span>' +
      '<span class="ouv-strip__deadline">' +
      I('clock', 12) +
      esc(dl.label) +
      '</span>' +
      '<span class="ouv-strip__go">Ver linha do tempo' +
      I('arrowRight', 12) +
      '</span></button>'
    );
  }

  /* A faixa que o sistema antigo resolvia com "Sem resposta do atendente há
     11 min" — aqui ela diz o que fazer, e some quando não há nada a fazer. */
  function slaCalloutHtml(c, sl) {
    var tone = sl.state === 'estourado' ? 'crit' : sl.state === 'proximo' ? 'warn' : 'info';
    var title, text;
    if (sl.state === 'estourado') {
      title = 'SLA estourado há ' + dur(-sl.mins);
      text = 'Esta conversa passou do tempo de resposta acordado para a fila ' + queue(c.queue).name + '.';
    } else if (sl.state === 'proximo') {
      title = 'SLA vence em ' + dur(sl.mins);
      text = 'Responda agora para manter o acordo da fila ' + queue(c.queue).name + '.';
    } else {
      title = 'Sem primeira resposta há ' + dur(Math.round((Date.now() - createdAt(c)) / 60000));
      text = 'O aluno ainda não falou com uma pessoa nesta conversa.';
    }
    return (
      '<div class="callout" data-tone="' +
      tone +
      '"><span class="callout__rail"></span><span class="callout__icon">' +
      I(tone === 'crit' ? 'alertTriangle' : 'clock', 15) +
      '</span><div class="callout__body"><p class="callout__title">' +
      esc(title) +
      '</p><p class="callout__text">' +
      esc(text) +
      '</p></div></div>'
    );
  }

  function renderThread() {
    var pane = $('#pane-thread');
    if (!pane) return;

        S.ctxOpen +
        '">' +
        I('panelRight', 15) +
        '</button></div>' +
        emptyHtml(
          'messageSquare',
          'Nenhuma conversa aberta',
          'Escolha uma conversa na fila à esquerda, ou use Ctrl+K para buscar um aluno pelo nome ou RA.',
          '<button class="btn btn--sm btn--secondary" data-act="palette">' + I('search', 14) + 'Buscar aluno</button>'
        );

  /**
   * Move a pílula azul para o item ativo. É o `layoutId` do Motion escrito à
   * mão: um único nó que se desloca, em vez de um fundo que acende num item e
   * apaga no outro. Na primeira pintura ela NASCE no lugar — deixar a
   * transição ligada a faria voar do topo da lista a cada render.
   */
  function syncNavPill(container, activeSel, pillSel) {
    if (!container) return;
    var pill = $(pillSel, container);
    var active = $(activeSel, container);
    if (!pill) return;
    if (!active || active.offsetParent === null) {
      pill.style.opacity = '0';
      return;
    }
    var first = pill.dataset.init !== '1';
    if (first) pill.style.transition = 'none';
    if (pillSel === '.rail-pill') {
      pill.style.transform = 'translateY(' + active.offsetTop + 'px)';
    } else {
      /* Medido por retângulo, não por offsetTop: um item dentro de uma pasta
         (ou de um grupo) tem outro offsetParent e a pílula pousaria no topo. */
      var cr = container.getBoundingClientRect();
      var ar = active.getBoundingClientRect();
      pill.style.width = ar.width + 'px';
      pill.style.height = ar.height + 'px';
      pill.style.transform =
        'translate(' + (ar.left - cr.left + container.scrollLeft) + 'px,' + (ar.top - cr.top + container.scrollTop) + 'px)';
    }
    pill.style.opacity = '1';
    if (first) {
      void pill.offsetWidth;
      pill.style.transition = '';
      pill.dataset.init = '1';
    }
  }

  /**
   * Re-renderizar a coluna troca a pilula por um no novo, e transicao nao roda
   * em elemento recem-nascido — ela piscaria no destino em vez de deslizar.
   * Estas duas funcoes carregam a posicao antiga para o no novo e forcam um
   * reflow antes de religar a transicao: do ponto de vista do olho, e a MESMA
   * pilula continuando o movimento, que e o que o `layoutId` do Motion faz.
   */
  function snapshotPill(sel) {
    var p = $(sel);
    return p && p.dataset.init === '1'
      ? { t: p.style.transform, w: p.style.width, h: p.style.height, o: p.style.opacity }
      : null;
  }

  function restorePill(sel, snap) {
    var p = $(sel);
    if (!p || !snap) return;
    p.style.transition = 'none';
    p.style.transform = snap.t;
    p.style.width = snap.w;
    p.style.height = snap.h;
    p.style.opacity = snap.o;
    p.dataset.init = '1';
    void p.offsetWidth;
    p.style.transition = '';
  }

  function syncPills() {
    syncNavPill($('#rail-nav'), '.rail__btn[aria-current="page"]', '.rail-pill');
    syncNavPill($('.views__scroll'), '.navitem[aria-current="true"]', '.nav-pill');
  }

  /** A pastilha do segmented é posicionada em JS — é o equivalente do
      `layoutId` do Motion, e por isso ela desliza em vez de piscar. */
  function syncSegThumbs(root) {
    $$('.seg', root || document).forEach(function (seg) {
      var thumb = $('.seg__thumb', seg);
      if (!thumb) return;
      var active = $('[aria-selected="true"]', seg);
      if (!active) {
        thumb.style.opacity = '0';
        return;
      }
      /* Na primeira pintura a pastilha NASCE no lugar. Deixar a transição
         ligada faria ela voar da esquerda toda vez que o painel re-renderiza
         — movimento que não comunica nada, só chama atenção. */
      var first = thumb.dataset.init !== '1';
      if (first) thumb.style.transition = 'none';
      thumb.style.opacity = '1';
      thumb.style.width = active.offsetWidth + 'px';
      thumb.style.transform = 'translateX(' + (active.offsetLeft - 2) + 'px)';
      if (first) {
        void thumb.offsetWidth;
        thumb.style.transition = '';
        thumb.dataset.init = '1';
      }
    });
  }

  function financialTone(st) {
    if (st.financial === 'inadimplente') return { tone: 'crit', label: 'Inadimplente' };
    if (st.financial === 'negociação') return { tone: 'warn', label: 'Em negociação' };
    if (st.financial === 'bolsista') return { tone: 'info', label: 'Bolsista PROUNI' };
    return { tone: 'ok', label: 'Adimplente', quiet: true };
  }
  /**
   * Um veredito só ganha cor quando existe algo a fazer sobre ele. "Formando"
   * e "transferência em análise" são fatos do cadastro, não urgências — eles
   * saem em tinta, para que o vermelho de evasão e o âmbar de DP continuem
   * pulando numa lista de vinte e seis linhas.
   */
  function academicTone(st) {
    if (st.academic === 'risco') return { tone: 'crit', label: 'Risco de evasão' };
    if (st.academic === 'dp') return { tone: 'warn', label: st.dps + ' DP em aberto' };
    if (st.academic === 'formando') return { tone: 'ok', label: 'Formando', quiet: true };
    if (st.academic === 'transferido') return { tone: 'ok', label: 'Transferência em análise', quiet: true };
    return { tone: 'ok', label: 'Situação regular', quiet: true };
  }
  function statusHtml(t) {
    return (

      '</span>'

  function historyFor(studentId) {
    var past = D.HISTORY.filter(function (h) {
      return h.studentId === studentId;
    });
    var closed = D.CONVERSATIONS.filter(function (c) {
      return c.studentId === studentId && c.status === 'encerrado';
    }).map(function (c) {
      return {
        id: c.id,
        studentId: c.studentId,
        subject: c.subject,
        channel: c.channel,
        queue: c.queue,
        agent: c.assignee,
        openedAt: createdAt(c),
        closedAt: c.closedAt,
        durationMin: Math.round((c.closedAt - createdAt(c)) / 60000),
        waitMin: 4,
        frtMin: Math.round((c.firstResponseAt - createdAt(c)) / 60000),
        rating: c.rating,
        tags: c.tags,
        summary: c.aiSummary,
        messages: c.messages,
      };
    });
    return closed.concat(past).sort(function (a, b) {
      return b.closedAt - a.closedAt;
    });
  }

  function shortDate(ts) {
    var d = new Date(ts);
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  }

  /** Destaca @menções num texto já escapado. */
  function withMentions(text) {
    return esc(text).replace(
      /@([A-ZÁÉÍÓÚÂÊÔÃÕÇ][\wÀ-ú]+(?: [A-ZÁÉÍÓÚÂÊÔÃÕÇ][\wÀ-ú]+){0,2})/g,
      '<span class="msg__mention">@$1</span>'
    );
  }

  /* ----------------------------------------------------------------------
     O painel direito tem três andares fixos:
       1. abas (Aluno · Copilot · Histórico)
       2. o conteúdo da aba, que rola
       3. as notas internas — ancoradas no rodapé, com rolagem PRÓPRIA.
     Rolar o painel nunca leva as notas embora: elas são a primeira coisa a
     ler ao abrir um atendimento, então não podem depender de rolagem.
     ---------------------------------------------------------------------- */

  var ctxMemo = { id: null, tab: null, scroll: 0, notesScroll: 0 };

  function renderContext() {
    var pane = $('#pane-context');
    if (!pane) return;
    var c = S.selected ? conv(S.selected) : null;
    if (!c) {
      pane.innerHTML =
        resizerHtml('context', 'left', 'Largura do painel do aluno') +
        '<div class="panehead"><div class="panehead__title"><h2>Contexto</h2></div></div>' +
        emptyHtml('user', 'Sem aluno em foco', 'Abra uma conversa para ver o contexto acadêmico e financeiro do aluno aqui.');
      return;
    }
    var st = student(c.studentId);

    /* Re-render no mesmo aluno e na mesma aba preserva as duas rolagens. */
    var oldBody = $('.ctx', pane);
    var oldNotes = $('.notes-dock__list', pane);
    var same = ctxMemo.id === c.id && ctxMemo.tab === S.ctxTab;
    var keep = same && oldBody ? oldBody.scrollTop : 0;
    var keepNotes = ctxMemo.id === c.id && oldNotes ? oldNotes.scrollTop : 0;
    var draft = $('#dock-note', pane);
    if (draft) S.noteDraft = draft.value;
    if (ctxMemo.id !== c.id) S.noteDraft = '';

    var tabs = [
      { id: 'aluno', label: 'Aluno', icon: 'user' },
      { id: 'copilot', label: 'Copilot', icon: 'sparkles' },
      { id: 'historico', label: 'Histórico', icon: 'history' },
    ];
    var head =
      '<div class="panehead"><div class="seg seg--fill" data-seg="ctx" role="tablist">' +
      '<span class="seg__thumb"></span>' +
      tabs
        .map(function (t) {
          return (
            '<button class="seg__opt" data-ctx-tab="' +
            t.id +
            '" role="tab" aria-selected="' +
            (S.ctxTab === t.id) +
            '">' +
            I(t.icon, 12) +
            t.label +
            '</button>'
          );
        })
        .join('') +
      '</div></div>';

    var body =
      S.ctxTab === 'copilot' ? copilotHtml(c, st) : S.ctxTab === 'historico' ? historyPanelHtml(c, st) : studentPanelHtml(c, st);

    pane.innerHTML =
      resizerHtml('context', 'left', 'Largura do painel do aluno') +
      head +
      '<div class="ctx scroll-slim' +
      (same ? '' : ' ctx--enter') +
      '">' +
      body +
      '</div>' +
      notesDockHtml(c, st);
    syncSegThumbs(pane);

    var nb = $('.ctx', pane);
    if (nb) nb.scrollTop = keep;
    var nl = $('.notes-dock__list', pane);
    if (nl) nl.scrollTop = keepNotes;
    var ta = $('#dock-note', pane);
    if (ta && S.noteDraft) {
      ta.value = S.noteDraft;
      autoGrowNote(ta);
    }
    ctxMemo.id = c.id;
    ctxMemo.tab = S.ctxTab;
  }

  /* -- Notas internas (rodapé fixo) ---------------------------------------- */

  function notesFor(c, st) {
    var out = st.notes.map(function (n) {
      return { author: n.author, at: n.at, text: n.text, scope: 'aluno' };
    });
    D.CONVERSATIONS.forEach(function (o) {
      if (o.studentId !== st.id) return;
      o.messages.forEach(function (m) {
        if (m.from === 'nota') out.push({ author: m.authorId, at: m.at, text: m.text, scope: o.id === c.id ? 'conversa' : 'outra', fresh: S.flashAt === m.at });
      });
    });
    return out.sort(function (a, b) {
      return b.at - a.at;
    });
  }

  function notesDockHtml(c, st) {
    var notes = notesFor(c, st);

      '<header class="notes-dock__head">' +

      '<button class="iconbtn iconbtn--sm notes-dock__send" data-act="dock-note-save" data-tip="Salvar nota (Enter)" aria-label="Salvar nota">' +
      I('send', 13) +

  function saveDockNote() {
    var c = S.selected ? conv(S.selected) : null;
    var ta = $('#dock-note');
    if (!c || !ta || !ta.value.trim()) return;
    var at = Date.now();
    c.messages.push({ from: 'nota', authorId: D.ME.id, text: ta.value.trim(), at: at });
    S.noteDraft = '';
    ta.value = '';
    S.flashAt = at;
    var list = $('.notes-dock__list');

    scrollMessages(true);
    S.flashAt = at;
    renderContext();
    S.flashAt = null;

    if (again) again.focus();

  /* -- Aba Histórico: tudo o que aconteceu com o aluno, em ordem ---------- */

  function timelineItems(c, st) {
    var items = [];
    var linked = {};
    D.CONVERSATIONS.forEach(function (o) {
      if (o.studentId !== st.id || !o.ouvidoria) return;
      o.ouvidoria.events.forEach(function (ev) {
        if (ev.ref) linked[ev.ref] = true;
        items.push({
          at: ev.at,
          kind: ev.kind,
          title: ev.title,
          body: ev.text,
          meta: o.ouvidoria.protocol,
          history: ev.ref || null,
        });
      });
    });
    historyFor(st.id).forEach(function (h) {
      if (linked[h.id]) return;
      items.push({
        at: h.openedAt,
        kind: 'contato',
        title: h.subject,
        body: h.summary,
        meta: queue(h.queue).name + ' · ' + (h.agent === 'bot' ? 'resolvido pela IA' : (agent(h.agent) || D.BOT).name.split(' ')[0]) + (h.rating ? ' · nota ' + h.rating : ''),
        history: h.id,
      });
    });
    D.CONVERSATIONS.forEach(function (o) {
      if (o.studentId !== st.id || o.status === 'encerrado') return;
      items.push({
        at: createdAt(o),
        kind: o.id === c.id ? 'atual' : 'aberta',
        title: o.id === c.id ? 'Esta conversa começou' : 'Outra conversa em aberto: ' + o.subject,
        body: o.messages[0].text,
        meta: channel(o.channel).name + ' · ' + queue(o.queue).name,
        conv: o.id === c.id ? null : o.id,
      });
      (o.events || []).forEach(function (ev) {
        items.push({ at: ev.at, kind: 'setor', title: ev.title, body: ev.text, meta: 'registro do atendimento' });
      });
    });
    st.notes.forEach(function (n) {
      items.push({ at: n.at, kind: 'nota', title: 'Nota interna · ' + (agent(n.author) || D.ME).name.split(' ').slice(0, 2).join(' '), body: n.text, meta: 'visível só para a equipe' });
    });
    return items.sort(function (a, b) {
      return S.histOrder === 'asc' ? a.at - b.at : b.at - a.at;
    });
  }

  /** Resultados simulados — texto derivado do caso real da conversa. */
  function copilotRun(id, c) {
    var st = student(c.studentId);
    var first = st.name.split(' ')[0];
    var out = { title: '', text: '', chips: null, insert: null, insertMode: 'reply' };
    var o = c.ouvidoria;
    var hist = historyFor(st.id);

    switch (id) {
      case 'resumo':
        out.title = 'Resumo da conversa';
        out.text =
          c.aiSummary +
          '\n\nMensagens: ' +
          c.messages.length +
          ' · Aberta há ' +
          dur(Math.round((Date.now() - createdAt(c)) / 60000)) +
          (c.firstResponseAt ? ' · 1ª resposta em ' + dur(Math.round((c.firstResponseAt - createdAt(c)) / 60000)) : ' · sem 1ª resposta');
        out.chips = c.tags.concat([queue(c.queue).name]);
        break;
      case 'ouv-resumo':
        out.title = 'Resumo da ouvidoria · ' + o.protocol;
        out.text =
          o.type + ' registrada em ' + shortDate(o.openedAt) + ' (' + o.origin.toLowerCase() + '), hoje na etapa "' +
          D.OUV_STAGES[o.stage - 1] + '" com ' + o.sector + '. ' + ouvDeadline(o).label.charAt(0).toUpperCase() + ouvDeadline(o).label.slice(1) + ' (' + shortDate(o.deadline) + ').\n\n' +
          'Em ordem:\n' +
          o.events
            .map(function (ev) {
              return '• ' + shortDate(ev.at) + ' — ' + ev.title + ': ' + ev.text;
            })
            .join('\n') +
          '\n\nO que o aluno precisa agora: ' + insightFor(c).need;
        out.chips = [o.protocol, o.type, o.sector];
        break;
      case 'ouv-retorno':
        out.title = 'Retorno formal ao manifestante';
        out.text = formalReply(c, st, first);
        out.insert = out.text;
        break;
      case 'intencao':
        out.title = 'Intenção detectada';
        out.text = c.aiIntent + '\n\nConfiança alta. A classificação usa o texto do aluno, a fila de origem e o histórico de ' + hist.length + ' conversas anteriores deste RA.';
        out.chips = [queue(c.queue).name, 'Prioridade ' + c.priority];
        break;
      case 'sugerir':
        out.title = 'Resposta sugerida';
        out.text = suggestReply(c, st, first);
        out.insert = out.text;
        break;
      case 'proxima':
        out.title = 'Próxima melhor ação';
        out.text = nextAction(c, st);
        break;
      case 'nota-ia':
        out.title = 'Nota interna sugerida';
        out.text =
          'Atendimento ' + (o ? 'da ouvidoria ' + o.protocol : 'de ' + c.aiIntent.toLowerCase()) + '. ' +
          insightFor(c).need + ' Próximo passo: ' + insightFor(c).todo[0].toLowerCase() + '.' +
          (insightFor(c).watch ? ' Atenção: ' + insightFor(c).watch : '');
        out.insert = out.text;
        out.insertMode = 'note';
        break;
      case 'base':
        out.title = 'Da base de conhecimento';
        out.text = o
          ? 'Procedimento: "Atendimento de manifestação de ouvidoria".\n\n1. Nunca pedir ao aluno que repita o relato — ele já está no protocolo.\n2. Dar uma data concreta, mesmo que seja a data do próximo retorno.\n3. Registrar cada contato como nota, citando a Ouvidoria (@Helena Martins Castro).\n4. Encerrar só depois que o aluno confirmar que o assunto foi resolvido.\n\nPrazo legal de resposta: ' + o.deadlineRule + '.'
          : 'Artigo: "' + c.aiIntent + '" — procedimento vigente para ' + queue(c.queue).name + '.\n\n1. Confirmar RA e identidade do aluno.\n2. Verificar bloqueios no acadêmico e no financeiro.\n3. Abrir protocolo na fila responsável.\n4. Informar o prazo oficial e registrar a nota interna.\n\nÚltima revisão: há 12 dias, por Coordenação de Atendimento.';
        out.chips = ['Procedimento interno', queue(c.queue).name];
        break;
      case 'similares':
        out.title = 'Casos parecidos';
        var sim = D.CONVERSATIONS.filter(function (x) {
          return x.id !== c.id && x.queue === c.queue;
        }).slice(0, 3);
        out.text = sim.length
          ? sim
              .map(function (x) {
                return '• ' + x.subject + ' — ' + student(x.studentId).name + ' (' + relTime(updatedAt(x)) + ')';
              })
              .join('\n') + '\n\nTodos seguiram o procedimento da fila ' + queue(c.queue).name + '.'
          : 'Nenhuma conversa parecida nas últimas semanas.';
        break;
      case 'empatia':
        out.title = 'Versão mais empática';
        out.text = S.composer.text ? empathize(S.composer.text, first) : 'Escreva algo no composer primeiro — eu reescrevo em cima do seu texto, não do zero.';
        out.insert = S.composer.text ? out.text : null;
        break;
      case 'curta':
        out.title = 'Versão mais curta';
        out.text = S.composer.text ? S.composer.text.split(/(?<=\.)\s+/).slice(0, 2).join(' ').slice(0, 260) : 'Não há texto no composer para encurtar.';
        out.insert = S.composer.text ? out.text : null;
        break;
      case 'formal':
        out.title = 'Versão mais formal';
        out.text = S.composer.text
          ? 'Prezado(a) ' + first + ',\n\n' + S.composer.text.replace(/^(oi|olá|ei)[,!]?\s*/i, '') + '\n\nAtenciosamente,\n' + D.ME.name + ' — ' + D.ME.role
          : 'Não há texto no composer para ajustar.';
        out.insert = S.composer.text ? out.text : null;
        break;
      case 'revisar':
        out.title = 'Texto revisado';
        out.text = S.composer.text
          ? S.composer.text.replace(/\bvc\b/gi, 'você').replace(/\bpq\b/gi, 'porque').replace(/\bpf\b/gi, 'por favor').replace(/\bta\b/gi, 'está').replace(/\bmatricula\b/gi, 'matrícula').replace(/\bhistorico\b/gi, 'histórico')
          : 'Não há texto no composer para revisar.';
        out.insert = S.composer.text ? out.text : null;
        break;
    }
    return out;
  }

  function suggestReply(c, st, first) {
    if (REPLY_BY_CONV[c.id]) return REPLY_BY_CONV[c.id](first);
    var base = {
      financeiro:
        'Oi, ' + first + '! Localizei sua mensalidade aqui.\n\nO erro no portal acontece quando o título já foi reemitido com a multa. Eu gerei uma segunda via atualizada, com vencimento para daqui a 3 dias úteis, e vou anexar o PDF nesta conversa.\n\nSe preferir parcelar o valor em aberto, também consigo simular aqui mesmo. Quer que eu faça?',
      secretaria:
        'Oi, ' + first + '! Já verifiquei seu cadastro.\n\nVou abrir a solicitação na Secretaria Acadêmica agora e te passo o número do protocolo ainda hoje. O prazo de análise é de até 5 dias úteis, e o retorno chega por aqui e no seu e-mail.\n\nPrecisa que eu adiante alguma coisa com a coordenação enquanto isso?',
      estagios:
        'Oi, ' + first + '! Recebi sua solicitação.\n\nVou protocolar o documento junto ao setor de Estágios e te aviso assim que sair. Enquanto isso, confirme comigo se os dados da concedente estão corretos — qualquer divergência trava a assinatura.',
      coordenacao:
        'Oi, ' + first + '! Consultei a coordenação do seu curso.\n\nVou confirmar a informação e te retorno por aqui ainda hoje. Se houver mudança de data ou de oferta, você é avisado por esta mesma conversa, sem precisar recomeçar.',
      suporte:
        'Oi, ' + first + '! Abri um chamado com o time de sistemas para liberar seu acesso.\n\nA previsão é de até 4 horas úteis. Sobre o prazo da atividade: eu registro na sua ocorrência que a falha foi do nosso lado, então a entrega não fica prejudicada.',
      'pos-ead':
        'Oi, ' + first + '! Verifiquei a sua matrícula na optativa.\n\nA escolha está registrada, mas a liberação no AVA ficou pendente. Já solicitei a sincronização manual — costuma entrar em até 24h e eu te aviso por aqui quando estiver disponível.',
      ouvidoria:
        'Oi, ' + first + '! Estou acompanhando o seu protocolo junto à Ouvidoria e já tenho uma posição do setor responsável. Te explico abaixo o que foi feito e qual é o próximo passo.',
    };
    return base[c.queue] || base.secretaria;
  }

  function formalReply(c, st, first) {
    var o = c.ouvidoria;
    return (
      'Prezado(a) ' + st.name + ',\n\n' +
      'Em atenção à sua manifestação registrada sob o protocolo ' + o.protocol + ' em ' + shortDate(o.openedAt) + ', informamos que o caso foi analisado pelo setor responsável (' + o.sector + ').\n\n' +
      (REPLY_BY_CONV[c.id] ? REPLY_BY_CONV[c.id](first).split('\n\n').slice(1, 2).join('') + '\n\n' : '') +
      'Permanecemos à disposição por este canal. A manifestação será concluída após a sua confirmação de que a demanda foi atendida.\n\n' +
      'Atenciosamente,\n' + D.ME.name + ' — Central de Atendimento UniAnchieta, em nome da Ouvidoria'
    );

  function nextAction(c, st) {
    if (c.ouvidoria) {
      var dl = ouvDeadline(c.ouvidoria);
      return 'Responder com data concreta e registrar para a Ouvidoria.\n\nA manifestação ' + c.ouvidoria.protocol + ' está em "' + D.OUV_STAGES[c.ouvidoria.stage - 1] + '", ' + dl.label + '. Envie a resposta ao aluno, depois deixe uma nota citando @Helena Martins Castro com o que foi informado — é assim que a Ouvidoria consegue concluir no prazo.';
    }
    if (st.academic === 'risco')
      return 'Oferecer renegociação antes de processar o pedido.\n\nO aluno tem ' + money(st.balance) + ' em aberto e sinalizou dificuldade financeira. Casos parecidos que receberam proposta de parcelamento na primeira resposta tiveram 3x menos evasão.';
    if (!c.assignee) return 'Assumir a conversa.\n\nEla está há ' + dur(Math.round((Date.now() - createdAt(c)) / 60000)) + ' na fila de ' + queue(c.queue).name + ' e o SLA ' + (sla(c).state === 'estourado' ? 'já estourou' : 'vence em ' + dur(sla(c).mins)) + '.';
    if (!c.firstResponseAt) return 'Enviar a primeira resposta agora.\n\nO aluno ainda não falou com uma pessoa. Uma primeira resposta, mesmo sem a solução final, reduz em 40% a chance de ele reabrir o assunto por outro canal.';
    if (st.balance > 0) return 'Registrar a pendência financeira na conversa.\n\nO aluno tem ' + money(st.balance) + ' em aberto, o que pode bloquear a solicitação atual. Vale avisar antes que ele descubra sozinho no portal.';
    return 'Confirmar o prazo e encerrar.\n\nO assunto já foi respondido e não há pendência no cadastro. Encerre com o template de encerramento cordial para liberar a fila.';

  function empathize(text, first) {
    return (
      'Oi, ' +
      first +
      '! Entendo perfeitamente a sua preocupação, e vou cuidar disso com você.\n\n' +
      text.replace(/^(oi|olá|ei)[,!]?\s*/i, '').replace(/^\w/, function (m) { return m.toUpperCase(); }) +
      '\n\nQualquer dúvida no caminho, é só me chamar por aqui que eu retomo de onde paramos.'
    );

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro de Sucesso ao Aluno · UniAnchieta</title>
    <meta
      name="description"
      content="Cockpit operacional do Centro de Sucesso ao Aluno da UniAnchieta: radares de risco, Health Score explicável e acolhimento humanizado com SLA."
    />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          // The store JSON-encodes its values, so the raw entry is '"dark"',
          // quotes included. Comparing the raw string against 'dark' silently
          // never matched, which is why the pre-paint pass used to disagree
          // with the app and flash the wrong palette.
          // A chave carrega o prefixo de schema de lib/storage.ts. Ela estava
          // presa em v3 depois de um bump para v4: o passe pré-pintura lia uma
          // chave que não existia mais, caía no padrão claro e o app trocava a
          // paleta no primeiro render — exatamente o flash que este bloco existe
          // para evitar. Se SCHEMA subir de novo, esta linha sobe com ele.
          var stored = localStorage.getItem('csa.v4.theme');
          // Light is the default. Dark is opt-in, never inherited from the OS.
          var theme = stored === 'dark' || stored === '"dark"' ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
